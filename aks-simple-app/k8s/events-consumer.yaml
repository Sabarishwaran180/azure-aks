apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-consumer
  namespace: aks-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: events-consumer
  template:
    metadata:
      labels:
        app: events-consumer
    spec:
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: app-data-secrets-kv
      containers:
        - name: events-consumer
          image: IMAGE_REGISTRY/events-consumer:IMAGE_TAG
          volumeMounts:
            - name: secrets-store-inline
              mountPath: /mnt/secrets-store
              readOnly: true
          env:
            - name: ORDERS_EVENTHUB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: app-data-secrets
                  key: orders-eventhub-connection-string
            - name: ORDERS_EVENTHUB_NAME
              valueFrom:
                secretKeyRef:
                  name: app-data-secrets
                  key: orders-eventhub-name
            - name: EVENTS_CONSUMER_GROUP
              value: "$Default"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: events-consumer
  namespace: aks-learning
spec:
  selector:
    app: events-consumer
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
