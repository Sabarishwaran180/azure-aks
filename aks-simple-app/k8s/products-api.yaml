apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-api
  namespace: aks-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products-api
  template:
    metadata:
      labels:
        app: products-api
    spec:
      containers:
        - name: products-api
          image: IMAGE_REGISTRY/products-api:IMAGE_TAG
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: products-api
  namespace: aks-learning
spec:
  selector:
    app: products-api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
