apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-api
  namespace: aks-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products-api
  template:
    metadata:
      labels:
        app: products-api
    spec:
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: app-data-secrets-kv
      containers:
        - name: products-api
          image: IMAGE_REGISTRY/products-api:IMAGE_TAG
          volumeMounts:
            - name: secrets-store-inline
              mountPath: /mnt/secrets-store
              readOnly: true
          env:
            - name: PRODUCTS_SQL_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: app-data-secrets
                  key: products-sql-connection-string
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: app-data-secrets
                  key: appinsights-connection-string
            - name: APPLICATIONINSIGHTS_ENABLE_LIVE_METRICS
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: products-api
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: products-api
  namespace: aks-learning
spec:
  selector:
    app: products-api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
