# ============================================================
# payment-service/deployment.yaml
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: production
  labels:
    app: payment-service
spec:
  replicas: 1   # was 2 — HPA will scale up if needed
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        azure.workload.identity/use: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3004"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: payment-service-sa
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: payment-service
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nodepool-type
                operator: In
                values: ["user"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: payment-service
            topologyKey: kubernetes.io/hostname  # payment pods MUST be on different nodes
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ["/bin/sh", "-c", "until nc -z postgres.databases.svc.cluster.local 5432; do sleep 2; done"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      containers:
      - name: payment-service
        image: acrecommerceprod.azurecr.io/payment-service:1.0.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3004
        envFrom:
        - configMapRef:
            name: payment-service-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payment-service-kv-secrets
              key: DB_PASSWORD
        - name: STRIPE_API_KEY
          valueFrom:
            secretKeyRef:
              name: payment-service-kv-secrets
              key: STRIPE_API_KEY
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: payment-service-kv-secrets
              key: JWT_SECRET
        - name: RABBITMQ_USER
          value: "appuser"
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: order-service-kv-secrets
              key: RABBITMQ_PASSWORD
        startupProbe:
          httpGet:
            path: /healthz
            port: 3004
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3004
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3004
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m              # was 150m
            memory: 64Mi          # was 128Mi
          limits:
            cpu: 200m             # was 500m
            memory: 192Mi         # was 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: secrets-store
          mountPath: /mnt/secrets
          readOnly: true
        - name: tmp
          mountPath: /tmp
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]   # Payment needs longer drain
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: payment-service-secrets
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: production
  labels:
    app: payment-service
spec:
  selector:
    app: payment-service
  ports:
  - name: http
    port: 3004
    targetPort: 3004
  type: ClusterIP
