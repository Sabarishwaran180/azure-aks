# ============================================================
# notification-service/deployment.yaml
# NOTE: This service is scaled by KEDA (not HPA).
# KEDA watches RabbitMQ queue depth and scales replicas.
# When queues are empty → scale to 0 (saves cost!)
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: production
  labels:
    app: notification-service
spec:
  # KEDA manages replica count — set initial value here
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        azure.workload.identity/use: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3005"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: notification-service-sa
      terminationGracePeriodSeconds: 60   # Allow time to finish processing messages
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nodepool-type
                operator: In
                values: ["user"]
      initContainers:
      - name: wait-for-rabbitmq
        image: busybox:1.36
        command: ["/bin/sh", "-c", "until nc -z rabbitmq.databases.svc.cluster.local 5672; do sleep 2; done"]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      containers:
      - name: notification-service
        image: acrecommerceprod.azurecr.io/notification-service:1.0.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3005
        envFrom:
        - configMapRef:
            name: notification-service-config
        env:
        - name: RABBITMQ_USER
          value: "appuser"
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: notification-service-kv-secrets
              key: RABBITMQ_PASSWORD
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: notification-service-kv-secrets
              key: SMTP_PASSWORD
        startupProbe:
          httpGet:
            path: /healthz
            port: 3005
          failureThreshold: 20
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3005
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3005
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: secrets-store
          mountPath: /mnt/secrets
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: notification-service-secrets
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: production
  labels:
    app: notification-service
spec:
  selector:
    app: notification-service
  ports:
  - name: http
    port: 3005
    targetPort: 3005
  type: ClusterIP
