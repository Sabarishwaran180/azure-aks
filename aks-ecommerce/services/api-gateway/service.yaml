apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: production
  labels:
    app: api-gateway
  annotations:
    # Expose metrics to Prometheus
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
spec:
  selector:
    app: api-gateway
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP           # Internal only; exposed via Ingress
