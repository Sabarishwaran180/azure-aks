# ============================================================
# api-gateway/deployment.yaml
# Advanced features demonstrated:
#   - Pod Anti-Affinity (spread across zones)
#   - Topology Spread Constraints
#   - Resource requests/limits
#   - Liveness/Readiness/Startup probes
#   - Sidecar: Fluent Bit log shipper
#   - Key Vault CSI volume mount
#   - Security Context (non-root, read-only rootfs)
#   - Graceful termination
#   - Rolling update strategy
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: production
  labels:
    app: api-gateway
    version: "1.0.0"
    component: gateway
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 1   # was 2 — HPA will scale up if needed
  # Rolling update: never have 0 pods, surge max 1 extra
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        version: "1.0.0"
        azure.workload.identity/use: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
        # Force pod restart when configmap changes (checksum trick)
        checksum/config: "{{ .Values.configChecksum }}"
    spec:
      serviceAccountName: api-gateway-sa
      terminationGracePeriodSeconds: 30

      # ── Security Context (pod-level) ──────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      # ── Topology Spread: spread pods across zones ─────
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: api-gateway
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: api-gateway

      # ── Node Affinity: only run on user node pool ─────
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nodepool-type
                operator: In
                values: ["user"]
        # Anti-affinity: don't put 2 gateway pods on same node
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: api-gateway
              topologyKey: kubernetes.io/hostname

      # ── Init Container: wait for downstream services ──
      initContainers:
      - name: wait-for-user-service
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - |
          until nc -z user-service.production.svc.cluster.local 3001; do
            echo "Waiting for user-service..."
            sleep 2
          done
          echo "user-service is ready"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]

      containers:
      # ── Main application container ────────────────────
      - name: api-gateway
        image: acrecommerceprod.azurecr.io/api-gateway:1.0.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP

        # Load config from ConfigMap
        envFrom:
        - configMapRef:
            name: api-gateway-config

        # ── Probes ────────────────────────────────────────
        startupProbe:
          httpGet:
            path: /healthz
            port: 3000
          failureThreshold: 30
          periodSeconds: 5
          # Max startup time: 30 * 5 = 150 seconds

        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1

        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1

        # ── Resources ─────────────────────────────────────
        resources:
          requests:
            cpu: 50m              # was 100m — VPA Auto will tune from here
            memory: 64Mi          # was 128Mi
          limits:
            cpu: 300m             # was 500m
            memory: 256Mi         # was 512Mi

        # ── Security Context (container-level) ────────────
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]

        volumeMounts:
        # Temp dir for Node.js to write to (read-only rootfs)
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs

        # Graceful shutdown: drain connections before terminating
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]

      # ── Sidecar: Fluent Bit log shipper ───────────────
      - name: fluent-bit
        image: fluent/fluent-bit:3.0
        ports:
        - containerPort: 2020
          name: metrics
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: logs
          mountPath: /app/logs
          readOnly: true
        - name: fluent-bit-config
          mountPath: /fluent-bit/etc/

      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: fluent-bit-config
        configMap:
          name: fluent-bit-config
