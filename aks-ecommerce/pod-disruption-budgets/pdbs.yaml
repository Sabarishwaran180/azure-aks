# ============================================================
# pdbs.yaml  ── TESTING / COST-OPTIMISED
#
# Production PDBs block cluster autoscaler from removing nodes
# because they keep minAvailable: 1 or 2.
# In testing we only have 1 replica per service, so a
# minAvailable: 1 PDB would make it IMPOSSIBLE to drain any node.
#
# Fix: set maxUnavailable: 1 everywhere so autoscaler can always
# evict pods freely. The pod is just rescheduled on another node.
# ============================================================

# ── API Gateway ───────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: production
spec:
  maxUnavailable: 1     # was minAvailable: 1 — allows free node drain
  selector:
    matchLabels:
      app: api-gateway
---
# ── User Service ──────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-service-pdb
  namespace: production
spec:
  maxUnavailable: 1     # was minAvailable: 1
  selector:
    matchLabels:
      app: user-service
---
# ── Product Service ───────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: product-service-pdb
  namespace: production
spec:
  maxUnavailable: 1     # was maxUnavailable: 50%
  selector:
    matchLabels:
      app: product-service
---
# ── Order Service ─────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service-pdb
  namespace: production
spec:
  maxUnavailable: 1     # was minAvailable: 1
  selector:
    matchLabels:
      app: order-service
---
# ── Payment Service ───────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-service-pdb
  namespace: production
spec:
  maxUnavailable: 1     # was minAvailable: 2 — test has only 1 replica anyway
  selector:
    matchLabels:
      app: payment-service
---
# ── Frontend ──────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: production
spec:
  maxUnavailable: 1     # was minAvailable: 1
  selector:
    matchLabels:
      app: frontend
---
# ── WHY THIS MATTERS FOR COST ─────────────────────────────
# Cluster autoscaler can only remove a node if ALL pods on it
# can be safely evicted. A PDB with minAvailable: 1 on a
# single-replica deployment blocks eviction entirely —
# the node can never be reclaimed, even at 2am when nobody
# is testing. maxUnavailable: 1 lets autoscaler drain freely.
