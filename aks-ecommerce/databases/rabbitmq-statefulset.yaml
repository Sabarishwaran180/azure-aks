# ============================================================
# rabbitmq-statefulset.yaml
# RabbitMQ for async messaging between Order, Payment, Notification services
# KEDA will scale Notification Service based on queue depth
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: databases
  labels:
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
  - name: metrics
    port: 15692
    targetPort: 15692
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: databases
data:
  rabbitmq.conf: |
    # Default vhost
    default_vhost = /
    default_user = appuser
    # Memory threshold — start throttling at 60% of RAM
    vm_memory_high_watermark.relative = 0.6
    # Disk threshold — alert when disk < 2GB free
    disk_free_limit.absolute = 2GB
    # Enable Prometheus metrics
    management.tcp.port = 15672
    prometheus.tcp.port = 15692
    # Connection/channel limits
    channel_max = 128
    # Heartbeat
    heartbeat = 60
    # Logging
    log.console = true
    log.console.level = info
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus,rabbitmq_peer_discovery_k8s].
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: databases
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "15692"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true

      containers:
      - name: rabbitmq
        image: rabbitmq:3.13-management-alpine
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        - containerPort: 15692
          name: metrics
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: "appuser"
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_ERLANG_COOKIE
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: ERLANG_COOKIE
        resources:
          requests:
            cpu: 50m              # was 200m
            memory: 128Mi         # was 512Mi
          limits:
            cpu: 300m             # was 1
            memory: 256Mi         # was 1Gi
        livenessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - ping
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - check_running
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 10
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: rabbitmq-data
          mountPath: /var/lib/rabbitmq
        - name: rabbitmq-config
          mountPath: /etc/rabbitmq

      volumes:
      - name: rabbitmq-config
        configMap:
          name: rabbitmq-config
          items:
          - key: rabbitmq.conf
            path: rabbitmq.conf
          - key: enabled_plugins
            path: enabled_plugins

  volumeClaimTemplates:
  - metadata:
      name: rabbitmq-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: azure-disk-standard
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: databases
type: Opaque
stringData:
  RABBITMQ_PASSWORD: "RabbitSecret101!"
  ERLANG_COOKIE: "secretcookie1234567890"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rabbitmq-pdb
  namespace: databases
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: rabbitmq
