# ============================================================
# service-accounts.yaml
# Kubernetes Service Accounts with Workload Identity annotations.
# Each microservice gets its OWN identity → principle of least privilege.
# The azure.workload.identity/client-id annotation links to the
# Azure Managed Identity created in 03-azure-keyvault-setup.sh
# ============================================================

# ── API Gateway ──────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway-sa
  namespace: production
  annotations:
    # Replace with actual client ID from 03-azure-keyvault-setup.sh
    azure.workload.identity/client-id: "<api-gateway-managed-identity-client-id>"
  labels:
    azure.workload.identity/use: "true"
    app: api-gateway
---
# ── User Service ─────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service-sa
  namespace: production
  annotations:
    azure.workload.identity/client-id: "<user-service-managed-identity-client-id>"
  labels:
    azure.workload.identity/use: "true"
    app: user-service
---
# ── Product Service ──────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-service-sa
  namespace: production
  annotations:
    azure.workload.identity/client-id: "<product-service-managed-identity-client-id>"
  labels:
    azure.workload.identity/use: "true"
    app: product-service
---
# ── Order Service ────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service-sa
  namespace: production
  annotations:
    azure.workload.identity/client-id: "<order-service-managed-identity-client-id>"
  labels:
    azure.workload.identity/use: "true"
    app: order-service
---
# ── Payment Service ──────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service-sa
  namespace: production
  annotations:
    azure.workload.identity/client-id: "<payment-service-managed-identity-client-id>"
  labels:
    azure.workload.identity/use: "true"
    app: payment-service
---
# ── Notification Service ─────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service-sa
  namespace: production
  annotations:
    azure.workload.identity/client-id: "<notification-service-managed-identity-client-id>"
  labels:
    azure.workload.identity/use: "true"
    app: notification-service
---
# ── Frontend ─────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: production
  labels:
    app: frontend
