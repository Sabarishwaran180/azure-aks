# ============================================================
# persistent-volume-claims.yaml
# PVCs for databases (bound to StatefulSets via volumeClaimTemplates)
# These are standalone PVCs for shared storage use cases.
# ============================================================

# Shared static assets volume (frontend CDN files)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: static-assets-pvc
  namespace: production
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: azure-files-standard   # was azure-files-premium
  resources:
    requests:
      storage: 2Gi                         # was 10Gi
---
# Product images storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: product-images-pvc
  namespace: production
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: azure-files-standard   # was azure-files-premium
  resources:
    requests:
      storage: 5Gi                         # was 50Gi
