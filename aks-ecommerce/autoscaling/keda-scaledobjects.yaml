# ============================================================
# keda-scaledobjects.yaml
# KEDA: Event-Driven Autoscaling
# Scales Notification Service based on RabbitMQ queue depth.
# Can scale to ZERO when queues are empty (saves cost!).
# ============================================================

# ── RabbitMQ Authentication (for KEDA to access RabbitMQ) ─
apiVersion: v1
kind: Secret
metadata:
  name: keda-rabbitmq-secret
  namespace: production
type: Opaque
stringData:
  # KEDA uses this to connect to RabbitMQ management API
  host: "http://appuser:RabbitSecret101!@rabbitmq.databases.svc.cluster.local:15672/vhost/%2F"
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
  namespace: production
spec:
  secretTargetRef:
  - parameter: host
    name: keda-rabbitmq-secret
    key: host
---
# ── KEDA ScaledObject: Notification Service ───────────────
# Scales based on combined queue depth of order + payment queues
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification-service-scaledobject
  namespace: production
spec:
  scaleTargetRef:
    name: notification-service
  minReplicaCount: 0
  maxReplicaCount: 5          # was 15 — test queue never needs 15 workers
  pollingInterval: 15         # was 10 — slightly less polling = less CPU
  cooldownPeriod: 20          # was 60 — scale to 0 faster when queues empty
  # KEDA won't interfere with HPA if both are present
  # (KEDA takes precedence over HPA for this deployment)
  triggers:
  # Trigger 1: Order queue depth
  - type: rabbitmq
    metadata:
      protocol: http
      queueName: order.created
      mode: QueueLength
      value: "5"          # 1 pod per 5 messages in queue
    authenticationRef:
      name: rabbitmq-trigger-auth
  # Trigger 2: Payment queue depth
  - type: rabbitmq
    metadata:
      protocol: http
      queueName: payment.processed
      mode: QueueLength
      value: "5"
    authenticationRef:
      name: rabbitmq-trigger-auth
  advanced:
    # Scale up aggressively, scale down carefully
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
          - type: Pods
            value: 5
            periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 60
          policies:
          - type: Pods
            value: 2
            periodSeconds: 30
---
