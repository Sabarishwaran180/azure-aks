# ============================================================
# hpa-configs.yaml  ── TESTING / COST-OPTIMISED
# Key changes vs production:
#   minReplicas: 1 everywhere   → idle cluster = 7 fewer pods
#   maxReplicas reduced         → prevents accidental runaway scale
#   scaleDown window: 60s       → faster scale-down = fewer node-hours
#   scaleUp threshold raised    → tolerates more CPU before adding pods
#   custom Pods metric removed  → no Prometheus adapter needed in test
#
# Cost impact: ~50-70% fewer running pods during idle periods
# ============================================================

# ── API Gateway HPA ───────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 1                  # was 2 — saves 1 pod at idle
  maxReplicas: 4                  # was 10 — test load never needs 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75    # was 60 — tolerate higher CPU before scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80    # was 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Pods
        value: 1                  # was 2 — add 1 at a time
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 60    # was 300 — scale down fast in test
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
---
