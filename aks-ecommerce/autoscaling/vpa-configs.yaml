    kind: Deployment
    name: user-service
  updatePolicy:
    updateMode: "Auto"
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
    - containerName: user-service
      minAllowed:
        cpu: 25m
        memory: 64Mi
      maxAllowed:
