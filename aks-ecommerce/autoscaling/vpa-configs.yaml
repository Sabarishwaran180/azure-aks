# ============================================================
# vpa-configs.yaml  ── TESTING / COST-OPTIMISED
# VPA mode: "Auto" for testing.
# Auto evicts and recreates pods with right-sized requests so
# you never waste RAM/CPU on over-provisioned idle containers.
#
# Modes recap:
#   Off      → recommendations only (use in production)
#   Initial  → sets resources at pod creation only
#   Auto     → live right-sizing with pod restarts  ← used here
#
# Cost impact: VPA Auto typically cuts idle CPU requests 40-60%
# and memory requests 20-40%, which lets the cluster autoscaler
# pack more pods per node → fewer nodes → lower bill.
# ============================================================

# ── API Gateway VPA ───────────────────────────────────────
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: api-gateway-vpa
  namespace: production
  annotations:
    note: "Auto mode — pods may restart when VPA adjusts resources"
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  updatePolicy:
    updateMode: "Auto"
    # Minimum change before VPA triggers a pod restart
    # Prevents constant churn for tiny fluctuations
    minReplicas: 1              # allow VPA to act even at 1 replica
  resourcePolicy:
    containerPolicies:
    - containerName: api-gateway
      minAllowed:
        cpu: 25m                # never go below 25m (prevents throttling)
        memory: 64Mi
      maxAllowed:
        cpu: 500m               # test env cap — not a prod gateway
        memory: 512Mi
      controlledResources: ["cpu", "memory"]
    # Sidecar: fluent-bit — let VPA manage it too
    - containerName: fluent-bit
      minAllowed:
        cpu: 10m
        memory: 32Mi
      maxAllowed:
        cpu: 100m
        memory: 128Mi
      controlledResources: ["cpu", "memory"]
---
# ── User Service VPA ──────────────────────────────────────
