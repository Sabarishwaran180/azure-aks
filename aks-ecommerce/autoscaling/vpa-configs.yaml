  namespace: production
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  updatePolicy:
    updateMode: "Auto"
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
    - containerName: frontend           # nginx is very lightweight
      minAllowed:
        cpu: 10m
        memory: 32Mi
      maxAllowed:
        cpu: 100m
        memory: 128Mi
      controlledResources: ["cpu", "memory"]
---
# ── HOW TO USE IN TESTING ──────────────────────────────────
# Watch VPA adjusting resources live:
#   kubectl get vpa -n production -w
#
# See current recommendations vs actual usage:
#   kubectl describe vpa api-gateway-vpa -n production
#
# Fields to watch:
#   Target        → what VPA wants to set NOW
#   Lower Bound   → safe minimum based on history
#   Upper Bound   → maximum it might need under spike
#
# When you promote to production:
#   1. Read the Target values from each VPA
#   2. Hard-code those as requests in deployment.yaml
#   3. Switch updateMode back to "Off"
