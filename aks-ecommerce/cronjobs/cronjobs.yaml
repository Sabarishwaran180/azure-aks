# ============================================================
# cronjobs.yaml
# Demonstrates Kubernetes CronJobs for:
#   1. Database backups (PostgreSQL + MongoDB)
#   2. Expired session cleanup
#   3. Product stock sync
#   4. Analytics report generation
# ============================================================

# ── 1. PostgreSQL Backup (daily at 2am) ───────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: databases
spec:
  schedule: "0 2 * * *"          # Every day at 02:00 UTC
  timeZone: "UTC"
  concurrencyPolicy: Forbid       # Never run 2 backups simultaneously
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300    # If missed, skip if >5min late
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600  # Fail job if backup takes >1 hour
      template:
        metadata:
          labels:
            app: postgres-backup
            job-type: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            fsGroup: 999
          # Only run on user pool nodes
          nodeSelector:
            nodepool-type: user
          containers:
          - name: pg-backup
            image: postgres:15-alpine
            command:
            - /bin/sh
            - -c
            - |
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              BACKUP_FILE="/backup/postgres_backup_${TIMESTAMP}.sql.gz"
              echo "Starting backup at $TIMESTAMP..."

              # Dump all databases
              PGPASSWORD=$POSTGRES_PASSWORD pg_dumpall \
                -h postgres.databases.svc.cluster.local \
                -U appuser \
                | gzip > "$BACKUP_FILE"

              echo "Backup completed: $BACKUP_FILE"
              echo "Size: $(du -sh $BACKUP_FILE | cut -f1)"

              # Upload to Azure Blob Storage using az cli
              # az storage blob upload \
              #   --account-name $STORAGE_ACCOUNT \
              #   --container-name db-backups \
              #   --name "$(basename $BACKUP_FILE)" \
              #   --file "$BACKUP_FILE" \
              #   --auth-mode login

              # Cleanup backups older than 30 days
              find /backup -name "*.sql.gz" -mtime +30 -delete
              echo "Old backups cleaned up"
            env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            resources:
              requests:
                cpu: 200m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 512Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 999
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
            volumeMounts:
            - name: backup-storage
              mountPath: /backup
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: backup-pvc
---
# PVC for backup storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-pvc
  namespace: databases
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: azure-disk-standard
  resources:
    requests:
      storage: 50Gi
---
# ── 2. Expired Sessions Cleanup (every hour) ─────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-expired-sessions
  namespace: production
spec:
  schedule: "0 * * * *"           # Every hour at :00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: session-cleanup
            job-type: maintenance
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          serviceAccountName: user-service-sa
          containers:
          - name: cleanup
            image: postgres:15-alpine
            command:
            - /bin/sh
            - -c
            - |
              echo "Cleaning up expired refresh tokens and sessions..."
              PGPASSWORD=$DB_PASSWORD psql \
                -h postgres.databases.svc.cluster.local \
                -U appuser \
                -d users_db \
                -c "DELETE FROM refresh_tokens WHERE expires_at < NOW();"
              DELETED=$?
              echo "Cleanup completed (exit: $DELETED)"
            env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-kv-secrets
                  key: DB_PASSWORD
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
---
# ── 3. Stale Order Cancellation (every 15 minutes) ────────
# Cancel orders that have been 'pending' for > 30 minutes (payment not received)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cancel-stale-orders
  namespace: production
spec:
  schedule: "*/15 * * * *"        # Every 15 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app: stale-order-cleanup
            job-type: maintenance
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          serviceAccountName: order-service-sa
          containers:
          - name: cancel-stale-orders
            image: postgres:15-alpine
            command:
            - /bin/sh
            - -c
            - |
              echo "Cancelling stale pending orders (>30 min old)..."
              PGPASSWORD=$DB_PASSWORD psql \
                -h postgres.databases.svc.cluster.local \
                -U appuser \
                -d orders_db \
                -c "UPDATE orders
                    SET status='cancelled', updated_at=NOW()
                    WHERE status='pending'
                    AND created_at < NOW() - INTERVAL '30 minutes'
                    RETURNING id;"
              echo "Done."
            env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-service-kv-secrets
                  key: DB_PASSWORD
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
---
# ── 4. Daily Analytics Report (weekdays at 8am) ───────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-analytics-report
  namespace: production
spec:
  schedule: "0 8 * * 1-5"         # Mon-Fri at 08:00 UTC
  timeZone: "UTC"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: analytics-report
            job-type: reporting
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          serviceAccountName: order-service-sa
          containers:
          - name: analytics
            image: postgres:15-alpine
            command:
            - /bin/sh
            - -c
            - |
              echo "=== Daily Analytics Report $(date) ==="
              PGPASSWORD=$DB_PASSWORD psql \
                -h postgres.databases.svc.cluster.local \
                -U appuser \
                -d orders_db \
                -c "SELECT
                      DATE(created_at) as date,
                      COUNT(*) as total_orders,
                      COUNT(CASE WHEN status='completed' THEN 1 END) as completed,
                      COUNT(CASE WHEN status='cancelled' THEN 1 END) as cancelled,
                      SUM(CASE WHEN status='completed' THEN total ELSE 0 END) as revenue
                    FROM orders
                    WHERE created_at >= NOW() - INTERVAL '24 hours'
                    GROUP BY DATE(created_at);"
              echo "Report generated successfully"
            env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-service-kv-secrets
                  key: DB_PASSWORD
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
---
# ── 5. MongoDB Index Optimization (weekly Sunday 3am) ─────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-maintenance
  namespace: databases
spec:
  schedule: "0 3 * * 0"           # Every Sunday at 03:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: mongodb-maintenance
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          containers:
          - name: mongo-maintenance
            image: mongo:7.0
            command:
            - /bin/sh
            - -c
            - |
              echo "Running MongoDB maintenance..."
              mongosh \
                "mongodb://appuser:$MONGODB_PASSWORD@mongodb.databases.svc.cluster.local:27017/admin" \
                --eval "
                  use products_db;
                  // Compact collections to reclaim space
                  db.runCommand({ compact: 'products' });
                  // Reindex for performance
                  db.products.reIndex();
                  print('MongoDB maintenance complete');
                "
            env:
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGODB_PASSWORD
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 999
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
