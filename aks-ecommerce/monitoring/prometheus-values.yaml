# ============================================================
# prometheus-values.yaml  ── TESTING / COST-OPTIMISED
# Key changes vs production:
#   retention: 3d           → was 30d  (10x less disk)
#   storage: 8Gi            → was 50Gi
#   storageClass: standard  → was premium-zrs (half the price)
#   resources halved        → Prometheus is the heaviest addon
#   AlertManager disabled   → no need for paging in test
#   grafana storage: 2Gi    → was 10Gi
# ============================================================

fullnameOverride: prometheus
namespaceOverride: monitoring

# ── Prometheus ────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 3d               # was 30d — only need recent data for testing
    retentionSize: "7GB"        # was 45GB

    replicas: 1
    scrapeInterval: 30s         # was 15s — halves ingest volume
    evaluationInterval: 30s

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: azure-disk-standard   # was azure-disk-premium-zrs
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 8Gi      # was 50Gi

    resources:
      requests:
        cpu: 100m               # was 500m
        memory: 512Mi           # was 2Gi
      limits:
        cpu: 500m               # was 2
        memory: 1Gi             # was 4Gi

    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector:
      matchLabels: {}
    podMonitorNamespaceSelector:
      matchLabels: {}

    additionalScrapeConfigs:
    - job_name: 'kubernetes-pods-annotation'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ['production', 'databases']
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: kubernetes_pod_name
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app

# ── Grafana ───────────────────────────────────────────────
grafana:
  enabled: true
  replicas: 1
  adminPassword: "GrafanaAdmin2024!"

  persistence:
    enabled: true
    storageClassName: azure-disk-standard   # was premium
    size: 2Gi                               # was 10Gi

  resources:
    requests:
      cpu: 50m                  # was 100m
      memory: 128Mi             # was 256Mi
    limits:
      cpu: 200m                 # was 500m
      memory: 256Mi             # was 512Mi

  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true

  grafana.ini:
    server:
      root_url: "http://localhost:3000"   # local port-forward for testing
    auth.anonymous:
      enabled: true                       # skip login in test env
      org_role: Viewer
    analytics:
      reporting_enabled: false

# ── AlertManager: DISABLED for testing ───────────────────
# No point paging people for test cluster events
alertmanager:
  enabled: false                          # was true — saves ~128Mi RAM

# ── Node Exporter ─────────────────────────────────────────
nodeExporter:
  enabled: true

# ── Kube State Metrics ────────────────────────────────────
kubeStateMetrics:
  enabled: true

# ── These are managed by AKS — keep disabled ──────────────
kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false

coreDns:
  enabled: true
kubelet:
  enabled: true

    # Additional scrape configs (for services with prometheus.io annotations)
    additionalScrapeConfigs:
    - job_name: 'kubernetes-pods-annotation'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ['production', 'databases']
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: kubernetes_pod_name
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app

# ── Grafana ───────────────────────────────────────────────
grafana:
  enabled: true
  replicas: 1

  adminPassword: "GrafanaAdmin2024!"  # Change in production!

  # Persistence for dashboards
  persistence:
    enabled: true
    storageClassName: azure-disk-standard
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Pre-load dashboards from ConfigMaps
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true

  # Grafana.ini configuration
  grafana.ini:
    server:
      root_url: "https://grafana.ecommerce.yourdomain.com"
    auth.anonymous:
      enabled: false
    security:
      allow_embedding: false
    analytics:
      reporting_enabled: false

  # Pre-configured datasources
  additionalDataSources:
  - name: Loki
    type: loki
    url: http://loki:3100
    access: proxy

# ── AlertManager ──────────────────────────────────────────
alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: azure-disk-standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  config:
    global:
      smtp_smarthost: "smtp.sendgrid.net:587"
      smtp_from: "alerts@ecommerce.yourdomain.com"
      smtp_auth_username: "apikey"
      smtp_auth_password: "<your-sendgrid-api-key>"
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default'
      routes:
      # Critical alerts → PagerDuty
      - match:
          severity: critical
        receiver: pagerduty
        continue: true
      # Warning alerts → Slack
      - match:
          severity: warning
        receiver: slack

    receivers:
    - name: 'default'
      email_configs:
      - to: "ops-team@yourdomain.com"
        send_resolved: true

    - name: 'slack'
      slack_configs:
      - api_url: "<your-slack-webhook-url>"
        channel: "#alerts-k8s"
        title: "{{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
        send_resolved: true

    - name: 'pagerduty'
      pagerduty_configs:
      - routing_key: "<your-pagerduty-integration-key>"
        description: "{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}"

# ── Node Exporter ─────────────────────────────────────────
nodeExporter:
  enabled: true

# ── Kube State Metrics ────────────────────────────────────
kubeStateMetrics:
  enabled: true

# ── Kube API Server metrics ───────────────────────────────
kubeApiServer:
  enabled: true

kubeControllerManager:
  enabled: false    # AKS manages control plane — not accessible

kubeScheduler:
  enabled: false    # AKS manages control plane — not accessible

kubeEtcd:
  enabled: false    # AKS manages etcd — not accessible

# ── CoreDNS ───────────────────────────────────────────────
coreDns:
  enabled: true

# ── Kubelet ───────────────────────────────────────────────
kubelet:
  enabled: true
