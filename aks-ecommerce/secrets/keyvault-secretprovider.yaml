# ============================================================
# keyvault-secretprovider.yaml
# Azure Key Vault CSI SecretProviderClass.
# Mounts Key Vault secrets into pods as files AND k8s Secrets.
# Uses Workload Identity (no static credentials needed).
# ============================================================

# ── Payment Service (needs Stripe key + DB password) ─────
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: payment-service-secrets
  namespace: production
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "<payment-service-managed-identity-client-id>"
    keyvaultName: "kv-ecommerce-test"
    cloudName: ""
    tenantId: "<your-tenant-id>"
    objects: |
      array:
        - |
          objectName: stripe-api-key
          objectType: secret
          objectVersion: ""
        - |
          objectName: postgres-password
          objectType: secret
          objectVersion: ""
        - |
          objectName: jwt-secret
          objectType: secret
          objectVersion: ""
  # Sync Key Vault secrets to Kubernetes Secrets
  # This allows using them as env vars too
  secretObjects:
  - secretName: payment-service-kv-secrets
    type: Opaque
    data:
    - objectName: stripe-api-key
      key: STRIPE_API_KEY
    - objectName: postgres-password
      key: DB_PASSWORD
    - objectName: jwt-secret
      key: JWT_SECRET
---
