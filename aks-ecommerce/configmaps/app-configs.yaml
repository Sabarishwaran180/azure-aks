# ============================================================
# app-configs.yaml
# ConfigMaps for all services.
# NON-SECRET configuration only. Secrets come from Key Vault.
# ============================================================

# ── API Gateway Config ────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: production
data:
  NODE_ENV: "production"
  PORT: "3000"
  USER_SERVICE_URL: "http://user-service.production.svc.cluster.local:3001"
  PRODUCT_SERVICE_URL: "http://product-service.production.svc.cluster.local:3002"
  ORDER_SERVICE_URL: "http://order-service.production.svc.cluster.local:3003"
  PAYMENT_SERVICE_URL: "http://payment-service.production.svc.cluster.local:3004"
  NOTIFICATION_SERVICE_URL: "http://notification-service.production.svc.cluster.local:3005"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "https://ecommerce.yourdomain.com"
---
# ── User Service Config ───────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: production
data:
  NODE_ENV: "production"
  PORT: "3001"
  DB_HOST: "postgres.databases.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "users_db"
  DB_USER: "appuser"
  JWT_EXPIRY: "15m"
  REFRESH_TOKEN_EXPIRY: "7d"
  LOG_LEVEL: "info"
  BCRYPT_ROUNDS: "12"
---
# ── Product Service Config ────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: product-service-config
  namespace: production
data:
  NODE_ENV: "production"
  PORT: "3002"
  MONGO_HOST: "mongodb.databases.svc.cluster.local"
  MONGO_PORT: "27017"
  MONGO_DB: "products_db"
  REDIS_HOST: "redis.databases.svc.cluster.local"
  REDIS_PORT: "6379"
  CACHE_TTL: "300"    # 5 minutes
  LOG_LEVEL: "info"
---
# ── Order Service Config ──────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: production
data:
  NODE_ENV: "production"
  PORT: "3003"
  DB_HOST: "postgres.databases.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "orders_db"
  DB_USER: "appuser"
  REDIS_HOST: "redis.databases.svc.cluster.local"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "rabbitmq.databases.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/"
  ORDER_QUEUE: "order.created"
  LOG_LEVEL: "info"
---
# ── Payment Service Config ────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: production
data:
  NODE_ENV: "production"
  PORT: "3004"
  DB_HOST: "postgres.databases.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "payments_db"
  DB_USER: "appuser"
  RABBITMQ_HOST: "rabbitmq.databases.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  PAYMENT_QUEUE: "payment.processed"
  STRIPE_API_URL: "https://api.stripe.com"
  LOG_LEVEL: "info"
---
# ── Notification Service Config ───────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: production
data:
  NODE_ENV: "production"
  PORT: "3005"
  RABBITMQ_HOST: "rabbitmq.databases.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  ORDER_QUEUE: "order.created"
  PAYMENT_QUEUE: "payment.processed"
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  SMTP_USER: "apikey"
  FROM_EMAIL: "noreply@ecommerce.yourdomain.com"
  LOG_LEVEL: "info"
---
# ── Frontend Config ───────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: production
data:
  REACT_APP_API_URL: "https://api.ecommerce.yourdomain.com"
  REACT_APP_ENV: "production"
  # Nginx config
  nginx.conf: |
    user  nginx;
    worker_processes  auto;
    error_log  /var/log/nginx/error.log warn;
    pid        /var/run/nginx.pid;
    events {
      worker_connections  1024;
    }
    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
      access_log  /var/log/nginx/access.log  main;
      sendfile        on;
      keepalive_timeout  65;
      gzip on;
      gzip_types text/plain application/json application/javascript text/css;
      server {
        listen       8080;
        server_name  _;
        root   /usr/share/nginx/html;
        index  index.html;
        # React Router support
        location / {
          try_files $uri $uri/ /index.html;
        }
        # Health check endpoint
        location /healthz {
          return 200 "OK";
          add_header Content-Type text/plain;
        }
        # Security headers
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';";
      }
    }
