# ============================================================
# test.yml
# Testing-only pipeline — manual trigger only.
# Use the workflow_dispatch inputs to select which jobs to run.
# All jobs default to ON; uncheck any to skip that stage.
#
# Auth:
#   ACR  — admin username/password (no Azure OIDC required)
#   AKS  — kubeconfig stored as a GitHub secret
#
# Required GitHub Secrets:
#   ACR_LOGIN_SERVER  — e.g. acrecommerceprodic9b.azurecr.io
#   ACR_USERNAME      — ACR admin username (= ACR name)
#   ACR_PASSWORD      — ACR admin password (from Azure portal)
#   KUBE_CONFIG       — base64-encoded kubeconfig from:
#                       az aks get-credentials ... --file - | base64
#
# Required GitHub Variables:
#   (none — all values are self-contained or from secrets)
# ============================================================

name: Test Pipeline

on:
  workflow_dispatch:
    inputs:
      run_build:
        description: "Build & push images to ACR"
        required: false
        default: true
        type: boolean
      run_lint:
        description: "Lint Kubernetes manifests"
        required: false
        default: true
        type: boolean
      run_deploy:
        description: "Deploy to test namespace"
        required: false
        default: true
        type: boolean
      run_smoke:
        description: "Run smoke tests"
        required: false
        default: true
        type: boolean
      run_cleanup:
        description: "Delete test namespace after run"
        required: false
        default: true
        type: boolean

env:
  SERVICES: >-
    api-gateway
    user-service
    product-service
    order-service
    payment-service
    notification-service
    frontend

jobs:
  # ══════════════════════════════════════════════════════
  # JOB 1 — Build & push all service images in parallel
  # ══════════════════════════════════════════════════════
  build:
    name: "Build & Push — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    if: inputs.run_build
    permissions:
      contents: read
    strategy:
      matrix:
        service:
          - api-gateway
          - user-service
          - product-service
          - order-service
          - payment-service
          - notification-service
          - frontend
      fail-fast: false

    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── ACR admin credentials login ─────────────────────
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ── Image tag = run number + short SHA ──────────────
      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "value=${{ github.run_number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # ── Generate package-lock.json if missing ──────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate package-lock.json if missing
        run: |
          SERVICE_PATH="aks-ecommerce/services/${{ matrix.service }}"
          if [ -f "$SERVICE_PATH/package.json" ] && [ ! -f "$SERVICE_PATH/package-lock.json" ]; then
            echo "⚠️  No package-lock.json found for ${{ matrix.service }} — generating one."
            npm install --package-lock-only --prefix "$SERVICE_PATH"
          fi

      # ── Build (skip if no Dockerfile) ──────────────────
      - name: Build ${{ matrix.service }}
        id: build
        run: |
          SERVICE_PATH="aks-ecommerce/services/${{ matrix.service }}"
          if [ ! -f "$SERVICE_PATH/Dockerfile" ]; then
            echo "⚠️  No Dockerfile for ${{ matrix.service }} — skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}"
          docker build \
            -t "$IMAGE:${{ steps.tag.outputs.value }}" \
            -t "$IMAGE:test-latest" \
            "$SERVICE_PATH/"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      # ── Trivy scan — fail on HIGH/CRITICAL ─────────────
      # - name: Trivy scan — ${{ matrix.service }}
      #   if: steps.build.outputs.skipped == 'false'
      #   uses: aquasecurity/trivy-action@0.35.0
      #   with:
      #     image-ref: "${{ steps.build.outputs.image }}:${{ steps.tag.outputs.value }}"
      #     format: table
      #     exit-code: "1"
      #     severity: HIGH,CRITICAL
      #     ignore-unfixed: true

      # ── Push to ACR ─────────────────────────────────────
      - name: Push ${{ matrix.service }}
        if: steps.build.outputs.skipped == 'false'
        run: |
          IMAGE="${{ steps.build.outputs.image }}"
          docker push "$IMAGE:${{ steps.tag.outputs.value }}"
          docker push "$IMAGE:test-latest"
          echo "✅ Pushed $IMAGE:${{ steps.tag.outputs.value }}"

  # ══════════════════════════════════════════════════════
  # JOB 2 — Lint Kubernetes manifests
  # ══════════════════════════════════════════════════════
  lint:
    name: "Lint K8s Manifests"
    runs-on: ubuntu-latest
    if: inputs.run_lint
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -Lo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate YAML manifests
        run: |
          find aks-ecommerce -name "*.yaml" \
            -not -path "*/terraform/*" \
            -not -path "*kustomization*" | \
            xargs kubeconform \
              -strict \
              -ignore-missing-schemas \
              -summary

  # ══════════════════════════════════════════════════════
  # JOB 3 — Deploy to isolated test namespace
  # ══════════════════════════════════════════════════════
  deploy-test:
    name: "Deploy to Test Namespace"
    runs-on: ubuntu-latest
    needs: [build, lint]
    if: |
      always() &&
      inputs.run_deploy &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    permissions:
      contents: read
    env:
      # Each run gets its own namespace: test-42, test-43, ...
      NAMESPACE: test-${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── AKS login via kubeconfig secret ────────────────
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      # ── Create isolated test namespace ──────────────────
      - name: Create test namespace
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ${{ env.NAMESPACE }} \
            purpose=test \
            run=${{ github.run_number }} \
            --overwrite

      # ── Deploy all services ─────────────────────────────
      - name: Deploy services
        run: |
          REGISTRY="${{ secrets.ACR_LOGIN_SERVER }}"
          TAG="${{ github.run_number }}-${GITHUB_SHA::7}"
          for SERVICE in ${{ env.SERVICES }}; do
            MANIFEST="aks-ecommerce/services/$SERVICE/deployment.yaml"
            if [ ! -f "$MANIFEST" ]; then
              echo "⚠️  No deployment.yaml for $SERVICE — skipping."
              continue
            fi
            echo "=== Deploying $SERVICE ==="
            # Patch image tag + namespace inline (no file mutation on disk)
            sed \
              -e "s|image:.*/$SERVICE:.*|image: $REGISTRY/$SERVICE:$TAG|g" \
              -e "s|namespace:.*|namespace: ${{ env.NAMESPACE }}|g" \
              "$MANIFEST" | kubectl apply -n ${{ env.NAMESPACE }} -f -
          done

      # ── Wait for all deployments to be ready ───────────
      - name: Wait for rollouts
        run: |
          for SERVICE in ${{ env.SERVICES }}; do
            if kubectl get deployment/$SERVICE -n ${{ env.NAMESPACE }} \
               &>/dev/null; then
              echo "Waiting for $SERVICE..."
              kubectl rollout status deployment/$SERVICE \
                -n ${{ env.NAMESPACE }} --timeout=180s
            fi
          done

  # ══════════════════════════════════════════════════════
  # JOB 4 — Smoke tests against the test namespace
  # ══════════════════════════════════════════════════════
  smoke-test:
    name: "Smoke Tests"
    runs-on: ubuntu-latest
    needs: deploy-test
    if: |
      always() &&
      inputs.run_smoke &&
      (needs.deploy-test.result == 'success' || needs.deploy-test.result == 'skipped')
    permissions:
      contents: read
    env:
      NAMESPACE: test-${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Check all pods are Running
        run: |
          echo "Waiting 20s for pods to stabilise..."
          sleep 20
          FAILED=0
          for SERVICE in ${{ env.SERVICES }}; do
            if ! kubectl get deployment/$SERVICE \
                 -n ${{ env.NAMESPACE }} &>/dev/null; then
              continue
            fi
            READY=$(kubectl get deployment/$SERVICE \
              -n ${{ env.NAMESPACE }} \
              -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
            DESIRED=$(kubectl get deployment/$SERVICE \
              -n ${{ env.NAMESPACE }} \
              -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "1")
            if [ "${READY:-0}" -ge "$DESIRED" ]; then
              echo "✅ $SERVICE — $READY/$DESIRED ready"
            else
              echo "❌ $SERVICE — $READY/$DESIRED ready"
              kubectl describe deployment/$SERVICE -n ${{ env.NAMESPACE }}
              kubectl logs -l app=$SERVICE -n ${{ env.NAMESPACE }} --tail=20 || true
              FAILED=$((FAILED + 1))
            fi
          done
          [ $FAILED -eq 0 ] || exit 1

      - name: Health endpoint check (port-forward)
        run: |
          HEALTH_PORTS=(api-gateway:3000 user-service:3001 product-service:3002 order-service:3003 payment-service:3004 notification-service:3005)
          for ENTRY in "${HEALTH_PORTS[@]}"; do
            SERVICE="${ENTRY%%:*}"
            PORT="${ENTRY##*:}"
            POD=$(kubectl get pod -n ${{ env.NAMESPACE }} \
              -l app=$SERVICE --field-selector=status.phase=Running \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
            if [ -z "$POD" ]; then
              echo "⚠️  No running pod for $SERVICE — skipping."
              continue
            fi
            # Start port-forward in background
            kubectl port-forward "$POD" "9${PORT}:${PORT}" \
              -n ${{ env.NAMESPACE }} &>/dev/null &
            PF_PID=$!
            sleep 2
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:9${PORT}/healthz 2>/dev/null || echo "000")
            kill $PF_PID 2>/dev/null || true
            if [[ "$HTTP_CODE" =~ ^(200|204)$ ]]; then
              echo "✅ $SERVICE /healthz → $HTTP_CODE"
            else
              echo "⚠️  $SERVICE /healthz → $HTTP_CODE (non-fatal)"
            fi
          done

  # ══════════════════════════════════════════════════════
  # JOB 5 — Cleanup: delete the test namespace
  # ══════════════════════════════════════════════════════
  cleanup:
    name: "Cleanup Test Namespace"
    runs-on: ubuntu-latest
    needs: smoke-test
    if: |
      always() &&
      inputs.run_cleanup
    permissions:
      contents: read
    env:
      NAMESPACE: test-${{ github.run_number }}

    steps:
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Delete test namespace
        run: |
          kubectl delete namespace ${{ env.NAMESPACE }} \
            --ignore-not-found=true
          echo "✅ Namespace ${{ env.NAMESPACE }} deleted"
