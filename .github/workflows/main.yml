# ============================================================
# AKS sample application pipeline
#
# App layout:
#   - frontend     : static UI served by NGINX
#   - products-api : FastAPI backend
#   - orders-api   : FastAPI backend
#
# Required GitHub Secrets:
#   ACR_LOGIN_SERVER
#   ACR_USERNAME
#   ACR_PASSWORD
#   KUBE_CONFIG
# ============================================================

name: AKS Sample App Pipeline

on:
  workflow_dispatch:
    inputs:
      run_build:
        description: "Build and push container images"
        required: false
        default: true
        type: boolean
      run_deploy:
        description: "Deploy the sample app to AKS"
        required: false
        default: true
        type: boolean

env:
  APP_ROOT: aks-simple-app
  NAMESPACE: aks-learning
  SERVICES: >-
    frontend
    products-api
    orders-api

jobs:
  build:
    name: "Build & Push — ${{ matrix.service }}"
    runs-on: ubuntu-latest
    if: inputs.run_build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - products-api
          - orders-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "value=${{ github.run_number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          SERVICE_PATH="${{ env.APP_ROOT }}/services/${{ matrix.service }}"
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}"
          docker build \
            -t "$IMAGE:${{ steps.tag.outputs.value }}" \
            -t "$IMAGE:latest" \
            "$SERVICE_PATH"

      - name: Push image
        run: |
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}"
          docker push "$IMAGE:${{ steps.tag.outputs.value }}"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build
    if: |
      always() &&
      inputs.run_deploy &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      - name: Create namespace
        run: kubectl apply -f ${{ env.APP_ROOT }}/k8s/namespace.yaml

      - name: Deploy services
        run: |
          REGISTRY="${{ secrets.ACR_LOGIN_SERVER }}"
          TAG="${{ github.run_number }}-${GITHUB_SHA::7}"
          for SERVICE in ${{ env.SERVICES }}; do
            sed \
              -e "s|IMAGE_REGISTRY|$REGISTRY|g" \
              -e "s|IMAGE_TAG|$TAG|g" \
              "${{ env.APP_ROOT }}/k8s/$SERVICE.yaml" | kubectl apply -f -
          done

      - name: Wait for rollouts
        run: |
          for SERVICE in ${{ env.SERVICES }}; do
            kubectl rollout status deployment/$SERVICE -n ${{ env.NAMESPACE }} --timeout=180s
          done
